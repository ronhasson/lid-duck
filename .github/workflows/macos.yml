name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check ducking behavior
        run: zsh scripts/check-engine.sh
      - name: Run XCTest suite
        run: swift test
      - name: Build app bundle
        run: zsh scripts/package-release.sh
      - name: Verify local signature
        run: codesign --verify --strict "dist/Lid Duck.app"
